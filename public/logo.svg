<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70">
  <defs>
    <linearGradient id="capGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e6fe0"/>
      <stop offset="1" stop-color="#0a3d91"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <g>
