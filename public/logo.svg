  <line x1="75" y1="6" x2="75" y2="60" stroke="#cbd5e1" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="85" y="38" font-size="34" fill="#0a56c7">TrueMark</text>
    <text x="188" y="38" font-size="28" fill="#16a34a">Edu</text>
    <text x="85" y="58" font-size="12" font-weight="400" fill="#334155" font-style="italic">True guidance. Global destinations.</text>
